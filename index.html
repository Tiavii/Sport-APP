<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlowFit Pro - UX Premium</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#000000">
    <style>
        /* Design Premium B&W & Noise Effect */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        
        .glass-nav {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: env(safe-area-inset-bottom); /* Adaptation Safe Area iOS */
        }

        /* Animations UX */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-item {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        
        @keyframes popCheck {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .check-icon.active {
            animation: popCheck 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Système de Toast (Feedback UI) */
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: slideOutRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Hitbox étendue pour Fitts' Law */
        .hitbox-label { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .hitbox-label:active .glass-card { transform: scale(0.98); }

        .progress-transition { transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-32 min-h-screen relative overflow-x-hidden selection:bg-white selection:text-black">

    <!-- Container pour les Toasts Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2"></div>

    <!-- Modale de Confirmation (Prévention d'erreur) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-6 opacity-0 transition-opacity duration-300">
        <div class="glass-card rounded-3xl p-6 w-full max-w-sm border-white/15">
            <h3 class="font-bold text-white text-lg mb-2">Clôturer la semaine ?</h3>
            <p class="text-xs text-zinc-400 mb-6 leading-relaxed">Cela va archiver tes performances actuelles dans l'historique et réinitialiser tes tâches pour la semaine prochaine. Cette action est irréversible.</p>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-zinc-900 text-zinc-300 text-xs font-bold uppercase tracking-widest hover:bg-zinc-800 transition-colors">Annuler</button>
                <button onclick="confirmArchive()" class="flex-1 py-3 rounded-2xl bg-white text-black text-xs font-bold uppercase tracking-widest hover:scale-[1.02] transition-transform">Confirmer</button>
            </div>
        </div>
    </div>

    <!-- Lumières Dynamiques B&W -->
    <div class="absolute top-[-10%] left-[-20%] w-[80vw] h-[80vw] bg-white/5 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-md mx-auto p-5 relative z-10">
        <!-- HEADER -->
        <header class="flex justify-between items-center mb-8 mt-2">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-white drop-shadow-md">GLOWFIT</h1>
                <p id="current-day-label" class="text-[10px] text-zinc-400 font-bold uppercase tracking-[0.2em] mt-1" aria-live="polite">Chargement...</p>
            </div>
            <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-white animate-pulse shadow-[0_0_15px_#ffffff]"></div>
        </header>

        <!-- BARRES DE PROGRESSION -->
        <div class="glass-card rounded-3xl p-5 mb-8 relative overflow-hidden">
            <div class="grid grid-cols-2 gap-6 relative z-10">
                <div>
                    <div class="flex justify-between text-xs font-semibold text-zinc-400 mb-2">
                        <span class="tracking-wider uppercase text-[9px]">Aujourd'hui</span>
                        <span id="day-progress-text" class="text-white">0%</span>
                    </div>
                    <div class="w-full bg-zinc-900 rounded-full h-1.5 overflow-hidden border border-white/5">
                        <div id="day-progress-bar" class="bg-white h-full rounded-full progress-transition" style="width: 0%" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold text-zinc-400 mb-2">
                        <span class="tracking-wider uppercase text-[9px]">Semaine</span>
                        <span id="week-progress-text" class="text-white">0%</span>
                    </div>
                    <div class="w-full bg-zinc-900 rounded-full h-1.5 overflow-hidden border border-white/5">
                        <div id="week-progress-bar" class="bg-zinc-400 h-full rounded-full progress-transition" style="width: 0%" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ZONE DE CONTENU -->
        <main id="tab-content" class="space-y-4" aria-live="polite">
            <!-- Injecté par JS -->
        </main>
    </div>

    <!-- NAVIGATION BASSE -->
    <nav class="glass-nav fixed bottom-0 left-0 right-0 pt-4 px-6 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center pb-2">
            <button onclick="switchTab('workout')" id="nav-workout" aria-label="Exercices" class="flex flex-col items-center gap-1.5 text-white transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span class="text-[9px] font-bold tracking-widest uppercase">Exos</span>
            </button>
            <button onclick="switchTab('nutrition')" id="nav-nutrition" aria-label="Nutrition" class="flex flex-col items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span class="text-[9px] font-bold tracking-widest uppercase">Diète</span>
            </button>
            <button onclick="switchTab('bilan')" id="nav-bilan" aria-label="Statistiques" class="flex flex-col items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2"/></svg>
                <span class="text-[9px] font-bold tracking-widest uppercase">Stats</span>
            </button>
            <button onclick="switchTab('profil')" id="nav-profil" aria-label="Profil utilisateur" class="flex flex-col items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span class="text-[9px] font-bold tracking-widest uppercase">Profil</span>
            </button>
        </div>
    </nav>

    <!-- LOGIQUE JS -->
    <script>
        const programData = {
            Lundi: { label: "Lundi · Focus Volume Abdos", exos: [
                { name: "Relevés de jambes au sol", reps: "3x12 Reps", rest: "60s", work: "Bas des abdos", desc: "Allongé sur le dos, monte les jambes tendues à la verticale puis redescends en 3 secondes." },
                { name: "Crunchs bras tendus ciel", reps: "3x15 Reps", rest: "60s", work: "Haut abdos", desc: "Bras tendus vers le plafond avec un poids. Décolle uniquement les omoplates." },
                { name: "Planche Commando", reps: "3x45 sec", rest: "60s", work: "Stabilité globale", desc: "Passe sur la paume des mains une par une, puis redescends sur les coudes." }
            ]},
            Mardi: { label: "Mardi · Épaules, Biceps & Posture", exos: [
                { name: "Développé Militaire", reps: "3x12 Reps", rest: "60s", work: "Deltoïdes", desc: "Pousse les haltères verticalement au-dessus de ta tête." },
                { name: "Curl Biceps classique", reps: "3x12 Reps", rest: "60s", work: "Galbe Biceps", desc: "Coudes verrouillés, contrôle la descente." },
                { name: "Élévations Latérales", reps: "4x15 Reps", rest: "60s", work: "Largeur Épaules", desc: "Monte les haltères sur les côtés jusqu'à hauteur d'épaules." },
                { name: "Face Pull (Haltères)", reps: "3x15 Reps", rest: "60s", work: "Arrière d'épaule", desc: "Allongé sur le ventre, lève les coudes vers le haut en serrant les omoplates." }
            ]},
            Mercredi: { label: "Mercredi · Obliques & Lignes", exos: [
                { name: "Russian Twists", reps: "3x20 Reps", rest: "60s", work: "Obliques", desc: "Pivote le haut du buste de gauche à droite." },
                { name: "Gainage Latéral", reps: "3x12 / côté", rest: "60s", work: "Verrouillage", desc: "Descends et remonte le bassin de haut en bas." },
                { name: "Crunchs Bicyclette", reps: "3x45 sec", rest: "60s", work: "Synchro", desc: "Amène le coude droit sur le genou gauche, puis inversement." }
            ]},
            Jeudi: { label: "Jeudi · Triceps & Posture", exos: [
                { name: "Dips sur chaise", reps: "3x15 Reps", rest: "60s", work: "Triceps", desc: "Descends le bassin vers le sol puis repousse fermement." },
                { name: "L'Oiseau", reps: "4x20 Reps", rest: "60s", work: "Dos / Trapèzes", desc: "Buste penché, ouvre tes bras sur les côtés." },
                { name: "Wall Angel", reps: "3x10 Reps", rest: "60s", work: "Colonne", desc: "Dos plaqué au mur. Fais glisser les bras vers le haut en Y." }
            ]},
            Vendredi: { label: "Vendredi · Bas du Ventre", exos: [
                { name: "Ciseaux de jambes", reps: "3x45 sec", rest: "60s", work: "Bas grand droit", desc: "Mouvements de ciseaux à 10cm du sol." },
                { name: "Genoux poitrine", reps: "3x12 Reps", rest: "60s", work: "Fléchisseurs", desc: "Assis, ramène tes genoux vers ta poitrine." },
                { name: "Planche classique", reps: "3x1 min", rest: "60s", work: "Transverse", desc: "Aspire ton nombril fort vers la colonne." }
            ]},
            Samedi: { label: "Samedi · Bras & Posture", exos: [
                { name: "Curl Marteau", reps: "3x12 Reps", rest: "60s", work: "Brachial", desc: "Prise neutre. Monte sans tourner les poignets." },
                { name: "Pompes Diamant", reps: "3x Max", rest: "60s", work: "Intérieur Pecs", desc: "Mains serrées en diamant sous la poitrine." },
                { name: "Face Pull", reps: "3x15 Reps", rest: "60s", work: "Correction dos", desc: "Indispensable pour contrer la courbure devant l'écran." }
            ]},
            Dimanche: { label: "Dimanche · Récupération Active", exos: [
                { name: "Stomach Vacuum", reps: "5x30 sec", rest: "45s", work: "Taille fine", desc: "Allongé, expire tout et aspire ton nombril." },
                { name: "Étirements Pectoraux", reps: "3x30 sec", rest: "0s", work: "Relâchement", desc: "Dans l'encadrement d'une porte, avance le buste." }
            ]}
        };

        const nutritionData = [
            { cycle: "Jours 1 & 2", type: "Midi", plat: "Poulet doré & Riz Basmati", details: "400g Poulet + 150g Riz div en 2." },
            { cycle: "Jours 1 & 2", type: "Soir", plat: "Pâtes au Bœuf Haché", details: "400g Bœuf 5% + 160g Pâtes + Coulis." },
            { cycle: "Jours 3 & 4", type: "Midi", plat: "Salade Pâtes, Thon & Œufs", details: "2 boîtes thon + 4 œufs + 160g pâtes." },
            { cycle: "Jours 3 & 4", type: "Soir", plat: "Riz sauté Bœuf & Omelette", details: "400g Bœuf + 3 œufs + 150g riz." },
            { cycle: "Jours 5 & 6", type: "Midi", plat: "Poulet tendre & Pâtes complètes", details: "400g Poulet + 160g pâtes." },
            { cycle: "Jours 5 & 6", type: "Soir", plat: "Rice Bowl Thon & Œufs mollets", details: "2 boîtes thon + 3 œufs + 150g riz." },
            { cycle: "Jour 7", type: "Midi/Soir", plat: "Omelette géante & Restes", details: "Vide les frigos, 6 œufs + viandes." }
        ];

        let currentTab = 'workout';
        const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
        let currentDayIndex = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
        let currentDay = days[currentDayIndex];

        let state = JSON.parse(localStorage.getItem('glowState_UX')) || {
            checkedExos: {},
            profile: { height: "", weight: "", age: "" },
            history: [],
            monthlyCount: 0
        };

        // UI Helpers (Heuristics)
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '✅' : '⚠️';
            const bgColor = type === 'success' ? 'bg-white text-black' : 'bg-red-500 text-white';
            
            toast.className = `toast-enter ${bgColor} px-4 py-3 rounded-xl shadow-lg font-bold text-xs tracking-wider uppercase flex items-center gap-2`;
            toast.innerHTML = `<span>${icon}</span> ${message}`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function toggleCheck(exoName) {
            const key = `${currentDay}-${exoName}`;
            state.checkedExos[key] = !state.checkedExos[key];
            saveData();
            render();
            
            // Haptic/UX Feedback for 100%
            if(document.getElementById('day-progress-text').innerText === '100%') {
                if(state.checkedExos[key]) showToast("Journée accomplie !");
            }
        }

        function saveData() {
            localStorage.setItem('glowState_UX', JSON.stringify(state));
            calculateProgress();
        }

        function calculateProgress() {
            const currentDayExos = programData[currentDay].exos;
            let dayChecked = 0;
            currentDayExos.forEach(exo => {
                if (state.checkedExos[`${currentDay}-${exo.name}`]) dayChecked++;
            });
            
            const dayPercent = currentDayExos.length === 0 ? 0 : Math.round((dayChecked / currentDayExos.length) * 100);
            const dayBar = document.getElementById('day-progress-bar');
            
            dayBar.style.width = dayPercent + '%';
            document.getElementById('day-progress-text').innerText = dayPercent + '%';

            const statusDot = document.getElementById('status-dot');
            if(dayPercent === 100) {
                dayBar.style.boxShadow = '0 0 15px rgba(255,255,255,0.8)';
                statusDot.classList.replace('bg-white', 'bg-emerald-400');
                statusDot.style.boxShadow = '0 0 15px #34d399';
            } else {
                dayBar.style.boxShadow = 'none';
                statusDot.classList.replace('bg-emerald-400', 'bg-white');
                statusDot.style.boxShadow = '0 0 15px #ffffff';
            }

            let totalWeeklyExos = 0, totalWeeklyChecked = 0;
            days.forEach(d => {
                programData[d].exos.forEach(exo => {
                    totalWeeklyExos++;
                    if (state.checkedExos[`${d}-${exo.name}`]) totalWeeklyChecked++;
                });
            });
            
            const weekPercent = totalWeeklyExos ? Math.round((totalWeeklyChecked / totalWeeklyExos) * 100) : 0;
            const weekBar = document.getElementById('week-progress-bar');
            weekBar.style.width = weekPercent + '%';
            document.getElementById('week-progress-text').innerText = weekPercent + '%';
            weekBar.style.boxShadow = weekPercent === 100 ? '0 0 15px rgba(161,161,170,0.8)' : 'none';
        }

        function switchTab(tab) {
            currentTab = tab;
            ['workout', 'nutrition', 'bilan', 'profil'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                btn.className = "flex flex-col items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors p-2";
            });
            document.getElementById(`nav-${tab}`).className = "flex flex-col items-center gap-1.5 text-white transition-colors p-2";
            render();
        }

        // Modal Logic (Error Prevention)
        function openModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            // Trigger reflow pour l'animation
            void modal.offsetWidth; 
            modal.classList.add('opacity-100');
        }

        function closeModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('opacity-100');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function confirmArchive() {
            let faits = [], manques = [];
            days.forEach(d => {
                programData[d].exos.forEach(exo => {
                    if (state.checkedExos[`${d}-${exo.name}`]) faits.push(`${d}: ${exo.name}`);
                    else manques.push(`${d}: ${exo.name}`);
                });
            });
            const topo = { date: new Date().toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'}), faits, manques };
            state.history.unshift(topo);
            state.checkedExos = {};
            state.monthlyCount++;
            saveData();
            closeModal();
            switchTab('bilan');
            showToast('Semaine archivée avec succès');
        }

        function render() {
            const content = document.getElementById('tab-content');
            document.getElementById('current-day-label').innerText = programData[currentDay].label;

            if (currentTab === 'workout') {
                let daySelectHtml = `<div class="flex gap-3 overflow-x-auto no-scrollbar pb-3 mb-2" role="tablist">`;
                days.forEach(d => {
                    const isSelected = d === currentDay ? 'bg-white text-black font-bold shadow-[0_0_15px_rgba(255,255,255,0.3)] scale-105' : 'bg-zinc-900 text-zinc-400 border border-white/5';
                    daySelectHtml += `<button role="tab" aria-selected="${d === currentDay}" onclick="currentDay='${d}'; render();" class="px-5 py-2.5 rounded-full text-[10px] uppercase tracking-widest whitespace-nowrap transition-all duration-300 ${isSelected}">${d}</button>`;
                });
                daySelectHtml += `</div>`;

                let exosHtml = `<div class="space-y-4 pb-4">`;
                programData[currentDay].exos.forEach((exo, index) => {
                    const isChecked = state.checkedExos[`${currentDay}-${exo.name}`];
                    const delay = index * 0.1; 
                    
                    // UX H3: Hitbox étendue sur toute la carte
                    exosHtml += `
                        <label class="hitbox-label block animate-item" style="animation-delay: ${delay}s">
                            <div class="glass-card rounded-3xl p-5">
                                <div class="flex items-start justify-between">
                                    <div class="flex-1 pr-4">
                                        <h3 class="font-bold text-white text-lg tracking-tight">${exo.name}</h3>
                                        <span class="inline-block bg-white/10 text-zinc-300 font-semibold text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-md mt-2 border border-white/5">${exo.work}</span>
                                    </div>
                                    <div class="relative flex items-center justify-center p-1">
                                        <input type="checkbox" onchange="toggleCheck('${exo.name}')" class="opacity-0 absolute w-0 h-0" ${isChecked ? 'checked' : ''} aria-label="Marquer ${exo.name} comme fait">
                                        <div class="w-8 h-8 rounded-full border-2 transition-all duration-300 flex items-center justify-center ${isChecked ? 'bg-white border-white' : 'bg-zinc-900 border-zinc-600'}">
                                            <svg class="w-4 h-4 text-black check-icon ${isChecked ? 'active hidden' : 'hidden'}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                    </div>
                                </div>
                                <p class="text-xs text-zinc-400 mt-4 leading-relaxed">${exo.desc}</p>
                                <div class="flex gap-5 mt-4 pt-4 border-t border-white/5 text-[10px] font-bold text-zinc-500 uppercase tracking-wider">
                                    <div><span class="text-white">${exo.reps}</span></div>
                                    <div>Pause: <span class="text-white">${exo.rest}</span></div>
                                </div>
                            </div>
                        </label>
                    `;
                });
                exosHtml += `</div>`;

                const ctaHtml = `
                    <button onclick="openModal()" aria-label="Clôturer la semaine" class="w-full bg-white hover:scale-[1.02] active:scale-95 text-black font-black text-xs uppercase tracking-widest py-5 rounded-3xl mt-4 mb-4 transition-all duration-300 shadow-[0_10px_30px_rgba(255,255,255,0.15)] flex justify-center items-center gap-2">
                        Clôturer la Semaine
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                    </button>
                `;

                content.innerHTML = daySelectHtml + exosHtml + ctaHtml;

                // Sync UI checkboxes
                document.querySelectorAll('input[type="checkbox"]').forEach(box => {
                    const icon = box.nextElementSibling.querySelector('.check-icon');
                    if(box.checked) icon.classList.remove('hidden');
                });

            } else if (currentTab === 'nutrition') {
                let nutHtml = `<div class="space-y-4 pb-4 animate-item">`;
                nutritionData.forEach(nut => {
                    nutHtml += `
                        <div class="glass-card rounded-3xl p-5">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-[9px] font-bold uppercase tracking-widest text-zinc-400">${nut.cycle}</span>
                                <span class="text-[9px] font-bold uppercase tracking-widest px-2.5 py-1 rounded border border-white/10 ${nut.type === 'Midi' ? 'bg-zinc-800 text-white' : 'bg-black text-zinc-300'}">${nut.type}</span>
                            </div>
                            <h3 class="font-bold text-white text-base tracking-tight">${nut.plat}</h3>
                            <p class="text-xs text-zinc-400 mt-2">${nut.details}</p>
                        </div>
                    `;
                });
                nutHtml += `</div>`;
                content.innerHTML = nutHtml;

            } else if (currentTab === 'bilan') {
                let bilanHtml = `<div class="space-y-4 animate-item">
                    <div class="glass-card rounded-3xl p-6 bg-gradient-to-br from-zinc-900 to-black border-white/5">
                        <h2 class="font-bold text-xs text-zinc-400 uppercase tracking-widest mb-2">Performances</h2>
                        <div class="flex items-end gap-2">
                            <span class="text-5xl font-black text-white">${state.monthlyCount}</span>
                            <span class="text-xs text-zinc-500 font-bold uppercase tracking-wider mb-1">Semaines validées</span>
                        </div>
                    </div>
                `;
                if (state.history.length === 0) {
                    // Empty state optimisé (H6)
                    bilanHtml += `
                        <div class="text-center py-12 px-6">
                            <div class="w-12 h-12 bg-zinc-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/5">
                                <svg class="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <p class="text-sm font-bold text-white mb-2">Aucun historique</p>
                            <p class="text-xs text-zinc-500 leading-relaxed">Termine ta première semaine d'entraînement et clique sur "Clôturer" pour voir tes statistiques apparaître ici.</p>
                        </div>
                    `;
                } else {
                    state.history.forEach((h, index) => {
                        bilanHtml += `
                            <div class="glass-card rounded-3xl p-5 mt-4">
                                <div class="flex justify-between items-center border-b border-white/5 pb-3 mb-3">
                                    <span class="font-bold text-xs text-white uppercase tracking-wider">Semaine du ${h.date}</span>
                                    <span class="text-[10px] text-zinc-500 font-bold">#${state.history.length - index}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-4 text-xs">
                                    <div>
                                        <span class="text-white font-bold block mb-2 text-[10px] uppercase tracking-wider">✅ Fait (${h.faits.length})</span>
                                        <div class="text-[11px] text-zinc-400 space-y-1">${h.faits.map(f => `· ${f}`).join('<br>') || 'Rien'}</div>
                                    </div>
                                    <div>
                                        <span class="text-zinc-500 font-bold block mb-2 text-[10px] uppercase tracking-wider">❌ Manqué (${h.manques.length})</span>
                                        <div class="text-[11px] text-zinc-600 space-y-1">${h.manques.map(m => `· ${m}`).join('<br>') || 'Rien'}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                bilanHtml += `</div>`;
                content.innerHTML = bilanHtml;

            } else if (currentTab === 'profil') {
                content.innerHTML = `
                    <div class="glass-card rounded-3xl p-6 space-y-5 animate-item">
                        <h2 class="font-bold text-[10px] text-zinc-400 uppercase tracking-widest border-b border-white/5 pb-3">Métriques Corporelles</h2>
                        <div class="space-y-4">
                            <div>
                                <label for="p-age" class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2">Âge</label>
                                <input type="number" id="p-age" min="1" max="120" value="${state.profile.age}" placeholder="Ex: 24" class="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-white transition-colors" required>
                            </div>
                            <div>
                                <label for="p-height" class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2">Taille (cm)</label>
                                <input type="number" id="p-height" min="100" max="250" value="${state.profile.height}" placeholder="Ex: 170" class="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-white transition-colors" required>
                            </div>
                            <div>
                                <label for="p-weight" class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2">Poids (kg)</label>
                                <input type="number" id="p-weight" min="30" max="300" value="${state.profile.weight}" placeholder="Ex: 60" class="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-white transition-colors" required>
                            </div>
                            <button onclick="saveProfile()" class="w-full bg-white text-black font-black text-xs uppercase tracking-widest py-4 rounded-2xl mt-4 hover:scale-[1.02] active:scale-95 transition-transform shadow-[0_5px_20px_rgba(255,255,255,0.1)]">
                                Sauvegarder
                            </button>
                        </div>
                    </div>
                `;
            }
            calculateProgress();
        }

        // Validation & Diagnostic Helper (H9)
        function saveProfile() {
            const age = document.getElementById('p-age').value;
            const height = document.getElementById('p-height').value;
            const weight = document.getElementById('p-weight').value;

            if(!age || !height || !weight || age <= 0 || height <= 0 || weight <= 0) {
                showToast("Saisie invalide", "error");
                return;
            }

            state.profile = { age, height, weight };
            saveData();
            showToast("Profil mis à jour");
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        render();
    </script>
</body>
</html>
