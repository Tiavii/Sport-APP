<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlowFit Pro - Évolution Étudiant</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#000000">
    <style>
        /* Design Premium B&W & Noise Effect */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }
        
        .workout-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        
        .glass-nav {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .progress-hebdo {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            background-color: #3f3f46;
        }

        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-item { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        
        @keyframes popCheck { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
        .check-icon.active { animation: popCheck 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: slideOutRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        .hitbox-label { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .hitbox-label:active .workout-card { transform: scale(0.98); }

        .progress-transition { transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-32 min-h-screen relative overflow-x-hidden selection:bg-white selection:text-black">

    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2"></div>

    <div id="confirm-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-6 opacity-0 transition-opacity duration-300">
        <div class="glass-card rounded-3xl p-6 w-full max-w-sm border-white/15">
            <h3 class="font-bold text-white text-lg mb-2">Clôturer la semaine ?</h3>
            <p class="text-xs text-zinc-400 mb-6 leading-relaxed">Cela va archiver tes performances et réinitialiser tes tâches pour la semaine prochaine.</p>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-zinc-900 text-zinc-300 text-xs font-bold uppercase tracking-widest hover:bg-zinc-800 transition-colors">Annuler</button>
                <button onclick="confirmArchive()" class="flex-1 py-3 rounded-2xl bg-white text-black text-xs font-bold uppercase tracking-widest hover:scale-[1.02] transition-transform">Confirmer</button>
            </div>
        </div>
    </div>

    <div class="absolute top-[-10%] left-[-20%] w-[80vw] h-[80vw] bg-white/5 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-md mx-auto p-5 relative z-10">
        <header class="flex justify-between items-center mb-8 mt-2">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-white drop-shadow-md">GLOWFIT</h1>
                <p id="current-day-label" class="text-[10px] text-zinc-400 font-bold uppercase tracking-[0.2em] mt-1">Chargement...</p>
            </div>
            <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-white animate-pulse shadow-[0_0_15px_#ffffff]"></div>
        </header>

        <!-- BARRES DE PROGRESSION -->
        <div class="glass-card rounded-3xl p-5 mb-8 relative overflow-hidden">
            <div class="grid grid-cols-2 gap-6 relative z-10">
                <div>
                    <div class="flex justify-between text-xs font-semibold text-zinc-400 mb-2">
                        <span class="tracking-wider uppercase text-[9px] font-bold text-white">Aujourd'hui</span>
                        <span id="day-progress-text" class="text-white font-bold">0%</span>
                    </div>
                    <div class="w-full bg-zinc-900 rounded-full h-2.5 overflow-hidden border border-white/5">
                        <div id="day-progress-bar" class="bg-white h-full rounded-full progress-transition shadow-[inset_0_1px_0_rgba(255,255,255,0.2)]" style="width: 0%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold text-zinc-400 mb-2">
                        <span class="tracking-wider uppercase text-[9px] font-medium text-zinc-400">Semaine</span>
                        <span id="week-progress-text" class="text-zinc-400 font-medium">0%</span>
                    </div>
                    <div class="w-full bg-zinc-900 rounded-full h-2.5 overflow-hidden border border-white/5">
                        <div id="week-progress-bar" class="progress-hebdo h-full rounded-full progress-transition border-r border-white/20" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <main id="tab-content" class="space-y-4" aria-live="polite">
            <!-- Injecté par JS -->
        </main>
    </div>

    <nav class="glass-nav fixed bottom-0 left-0 right-0 pt-4 px-6 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center pb-2">
            <button onclick="switchTab('workout')" id="nav-workout" class="flex flex-col items-center gap-1.5 text-white transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span class="text-[9px] font-bold tracking-widest uppercase">Exos</span>
            </button>
            <button onclick="switchTab('nutrition')" id="nav-nutrition" class="flex flex-col items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span class="text-[9px] font-bold tracking-widest uppercase">Diète</span>
            </button>
            <button onclick="switchTab('bilan')" id="nav-bilan" class="flex flex-col items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2"/></svg>
                <span class="text-[9px] font-bold tracking-widest uppercase">Stats</span>
            </button>
            <button onclick="switchTab('profil')" id="nav-profil" class="flex flex-col items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span class="text-[9px] font-bold tracking-widest uppercase">Profil</span>
            </button>
        </div>
    </nav>

    <!-- LOGIQUE JS -->
    <script>
        const programData = {

                { name: "Wall Angel", reps: "3x10 Reps", rest: "60s", work: "Colonne", desc: "Dos plaqué au mur. Fais glisser les bras vers le haut en Y." }

                { name: "Genoux poitrine", reps: "3x12 Reps", rest: "60s", work: "Fléchisseurs", desc: "Assis, ramène tes genoux vers ta poitrine." },
                { name: "Planche classique", reps: "3x1 min", rest: "60s", work: "Transverse", desc: "Aspire ton nombril fort vers la colonne." }
            ]},

                { name: "Curl Marteau", reps: "3x12 Reps", rest: "60s", work: "Brachial", desc: "Prise neutre. Monte sans tourner les poignets." },
                { name: "Pompes Diamant", reps: "3x Max", rest: "60s", work: "Intérieur Pecs", desc: "Mains serrées en diamant sous la poitrine." },
                { name: "Face Pull", reps: "3x15 Reps", rest: "60s", work: "Correction dos", desc: "Indispensable pour contrer la courbure devant l'écran." }
            ]},
            Dimanche: { label: "Dimanche · Récupération Active", exos: [
                { name: "Stomach Vacuum", reps: "5x30 sec", rest: "45s", work: "Taille fine", desc: "Allongé, expire tout et aspire ton nombril." },
                { name: "Étirements Pectoraux", reps: "3x30 sec", rest: "0s", work: "Relâchement", desc: "Dans l'encadrement d'une porte, avance le buste." }
            ]}
        };

        function getWeekNumber() {
            const currentDate = new Date();
            const startDate = new Date(currentDate.getFullYear(), 0, 1);
            const days = Math.floor((currentDate - startDate) / (24 * 60 * 60 * 1000));
            return Math.ceil((currentDate.getDay() + 1 + days) / 7);
        }

        const rotationMenus = [
            // Semaine 1
            {
                budget: { auchan: { sans: "15.10€", avec: "13.95€" }, carrefour: { sans: "15.35€", avec: "14.10€" }, liste: "500g Poulet surgelé, 500g Bœuf 15%, 2b Thon, 12 Œufs, 1kg Pâtes, 1kg Riz, 1 brique Coulis, 1 pot Crème." },
                daysMeals: {
                    "Lundi & Mardi": { midi: "Poulet Crème & Riz (200g poulet doré, riz blanc, 1 cuillère de crème)", soir: "Pâtes au Thon Tomate (80g pâtes, 1 boîte thon, coulis tomate)" },
                    "Mercredi & Jeudi": { midi: "Omelette Riz Sauté (Riz cuit de la veille sauté avec 2 œufs battus)", soir: "Bœuf Haché & Pâtes (200g bœuf haché 15% cuit, mélangé à 80g de pâtes)" },
                    "Vendredi & Samedi": { midi: "Poulet Moutarde & Riz (200g poulet cuit blanc, sauce moutarde/eau, riz)", soir: "Salade Pâtes & Œufs durs (Pâtes froides, 2 œufs durs coupés en dés)" },
                    "Dimanche (Récup)": { midi: "Omelette Vide-Frigo (Moitié des restes de riz/pâtes + 1 œuf poêlé)", soir: "Le Bol de Fin de Semaine (Reste final de féculents + ton dernier œuf)" }
                }
            },
            // Semaine 2
            {
                budget: { auchan: { sans: "14.40€", avec: "13.50€" }, carrefour: { sans: "14.65€", avec: "13.75€" }, liste: "350g Poulet, 500g Bœuf, 3b Thon, 12 Œufs, 1kg Pâtes, 1kg Riz, 2 briques Coulis." },
                daysMeals: {
                    "Lundi & Mardi": { midi: "Riz Cantonais Étudiant (Riz blanc sauté à la poêle avec 2 œufs brouillés)", soir: "Gratin Pâtes Bolognaise (200g bœuf haché éco cuit avec du coulis sur pâtes)" },
                    "Mercredi & Jeudi": { midi: "Salade Riz & Thon (150g de riz froid mélangé avec 1 boîte de thon)", soir: "Poulet Ketchup Sésame (175g poulet enrobé de ketchup/sauce soja + pâtes)" },
                    "Vendredi & Samedi": { midi: "Pâtes Miroir aux Œufs (80g de pâtes chaudes surmontées de 2 œufs au plat)", soir: "Riz chaud au Thon fondant (1 boîte thon mélangée à chaud dans le riz)" },
                    "Dimanche (Récup)": { midi: "Poêlée anti-gâchis (Fonds de riz restants sautés à sec)", soir: "Omelette Coquillettes (Tes 2 derniers œufs coulés sur tes restes de pâtes)" }
                }
            },
            // Semaine 3
            {
                budget: { auchan: { sans: "15.50€", avec: "14.30€" }, carrefour: { sans: "15.80€", avec: "14.50€" }, liste: "600g Poulet, 600g Bœuf haché, 2b Thon, 10 Œufs, 1kg Pâtes, 1kg Riz, 1 brique Coulis." },
                daysMeals: {
                    "Lundi & Mardi": { midi: "Bœuf Épicé & Riz (200g bœuf haché cuit aux épices de base sur riz)", soir: "Pâtes Poulet Paprika (200g poulet sauté en lanières fines, pâtes)" },
                    "Mercredi & Jeudi": { midi: "Riz & Œufs au plat (Riz blanc chaud surmonté de 2 œufs coulants)", soir: "Pâtes froides de la Fac au Thon (Pâtes mélangées froides avec 1 boîte de thon)" },
                    "Vendredi & Samedi": { midi: "Poulet grillé & Riz blanc (200g blanc de poulet saisi à vif poêle, riz)", soir: "Bœuf Tomate & Coquillettes (200g bœuf haché mijoté dans du coulis, pâtes)" },
                    "Dimanche (Récup)": { midi: "Riz sauté aux restes de viandes (Fonds de bœuf/poulet coupés fins)", soir: "L'Omelette Finale (Tes 2 derniers œufs battus sur les derniers féculents)" }
                }
            },
            // Semaine 4
            {
                budget: { auchan: { sans: "14.20€", avec: "13.40€" }, carrefour: { sans: "14.45€", avec: "13.60€" }, liste: "400g Poulet, 400g Bœuf, 2b Thon, 12 Œufs, 1kg Pâtes, 1kg Riz, 1 brique Coulis." },
                daysMeals: {
                    "Lundi & Mardi": { midi: "Poulet Doré & Riz (200g poulet coupé en dés pour cuire vite, riz)", soir: "Pâtes & Rillettes de Thon (1 boîte thon écrasée à la fourchette avec pâtes)" },
                    "Mercredi & Jeudi": { midi: "Boulettes de Bœuf & Riz (200g bœuf haché façonné en boulettes poêlées)", soir: "Pâtes aux Œufs Brouillés (Casse 2 œufs dans tes pâtes égouttées à chaud)" },
                    "Vendredi & Samedi": { midi: "Riz Froid au Poulet (150g riz mélangé à tes morceaux de poulet cuits)", soir: "Bœuf Haché Bolognaise (200g bœuf haché cuit étalé sur coquillettes au coulis)" },
                    "Dimanche (Récup)": { midi: "Bol du Frigo (Riz blanc restant réchauffé au micro-ondes)", soir: "Omelette Éco Générique (2 œufs battus coulés sur le reste des pâtes)" }
                }
            }
        ];

        let currentTab = 'workout';
        const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
        let currentDayIndex = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
        let currentDay = days[currentDayIndex];
        
        let isEditingProfile = false; // Variable pour le basculement du profil

        let state = JSON.parse(localStorage.getItem('glowState_UXv5')) || {
            checkedExos: {},
            profile: { height: "170", weight: "60", age: "24" },
            history: [],
            monthlyCount: 0
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '✅' : '⚠️';
            const bgColor = type === 'success' ? 'bg-white text-black' : 'bg-red-500 text-white';
            
            toast.className = `toast-enter ${bgColor} px-4 py-3 rounded-xl shadow-lg font-bold text-xs tracking-wider uppercase flex items-center gap-2`;
            toast.innerHTML = `<span>${icon}</span> ${message}`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function toggleCheck(exoName) {
            const key = `${currentDay}-${exoName}`;
            state.checkedExos[key] = !state.checkedExos[key];
            saveData();
            render();
        }

        function saveData() {
            localStorage.setItem('glowState_UXv5', JSON.stringify(state));
            calculateProgress();
        }

        function calculateProgress() {
            const currentDayExos = programData[currentDay].exos;
            let dayChecked = 0;
            currentDayExos.forEach(exo => {
                if (state.checkedExos[`${currentDay}-${exo.name}`]) dayChecked++;
            });
            
            const dayPercent = currentDayExos.length === 0 ? 0 : Math.round((dayChecked / currentDayExos.length) * 100);
            document.getElementById('day-progress-bar').style.width = dayPercent + '%';
            document.getElementById('day-progress-text').innerText = dayPercent + '%';

            const statusDot = document.getElementById('status-dot');
            if(dayPercent === 100) {
                document.getElementById('day-progress-bar').style.boxShadow = '0 0 15px rgba(255,255,255,0.8)';
                statusDot.classList.replace('bg-white', 'bg-emerald-400');
                statusDot.style.boxShadow = '0 0 15px #34d399';
            } else {
                document.getElementById('day-progress-bar').style.boxShadow = 'none';
                statusDot.classList.replace('bg-emerald-400', 'bg-white');
                statusDot.style.boxShadow = '0 0 15px #ffffff';
            }

            let totalWeeklyExos = 0, totalWeeklyChecked = 0;
            days.forEach(d => {
                programData[d].exos.forEach(exo => {
                    totalWeeklyExos++;
                    if (state.checkedExos[`${d}-${exo.name}`]) totalWeeklyChecked++;
                });
            });
            
            const weekPercent = totalWeeklyExos ? Math.round((totalWeeklyChecked / totalWeeklyExos) * 100) : 0;
            document.getElementById('week-progress-bar').style.width = weekPercent + '%';
            document.getElementById('week-progress-text').innerText = weekPercent + '%';
        }

        function switchTab(tab) {
            currentTab = tab;
            ['workout', 'nutrition', 'bilan', 'profil'].forEach(t => {
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors p-2";
            });
            document.getElementById(`nav-${tab}`).className = "flex flex-col items-center gap-1.5 text-white transition-colors p-2";
            render();
        }

        function openModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.add('opacity-100');
        }

        function closeModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('opacity-100');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function confirmArchive() {
            let faits = [], manques = [];
            days.forEach(d => {
                programData[d].exos.forEach(exo => {
                    if (state.checkedExos[`${d}-${exo.name}`]) faits.push(`${d}: ${exo.name}`);
                    else manques.push(`${d}: ${exo.name}`);
                });
            });
            const topo = { date: new Date().toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'}), faits, manques };
            state.history.unshift(topo);
            state.checkedExos = {};
            state.monthlyCount++;
            saveData();
            closeModal();
            switchTab('bilan');
            showToast('Semaine archivée avec succès');
        }

        function render() {
            const content = document.getElementById('tab-content');
            document.getElementById('current-day-label').innerText = programData[currentDay].label;

            if (currentTab === 'workout') {
                let daySelectHtml = `<div class="flex gap-3 overflow-x-auto no-scrollbar pb-3 mb-2" role="tablist">`;
                days.forEach(d => {
                    const isSelected = d === currentDay ? 'bg-white text-black font-bold shadow-[0_0_15px_rgba(255,255,255,0.3)] scale-105' : 'bg-zinc-900 text-zinc-400 border border-white/5';
                    daySelectHtml += `<button role="tab" aria-selected="${d === currentDay}" onclick="currentDay='${d}'; render();" class="px-5 py-2.5 rounded-full text-[10px] uppercase tracking-widest whitespace-nowrap transition-all duration-300 ${isSelected}">${d}</button>`;
                });
                daySelectHtml += `</div>`;

                let exosHtml = `<div class="space-y-4 pb-4">`;
                programData[currentDay].exos.forEach((exo, index) => {
                    const isChecked = state.checkedExos[`${currentDay}-${exo.name}`];
                    const delay = index * 0.1; 
                    
                    exosHtml += `
                        <label class="hitbox-label block animate-item" style="animation-delay: ${delay}s">
                            <div class="workout-card rounded-3xl p-5">
                                <div class="flex items-start justify-between">
                                    <div class="flex-1 pr-4">
                                        <h3 class="font-bold text-white text-lg tracking-tight">${exo.name}</h3>
                                        <span class="inline-block bg-white/10 text-white font-bold text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-md mt-2 border border-white/10">${exo.work}</span>
                                    </div>
                                    <div class="relative flex items-center justify-center p-1">
                                        <input type="checkbox" onchange="toggleCheck('${exo.name}')" class="opacity-0 absolute w-0 h-0" ${isChecked ? 'checked' : ''}>
                                        <div class="w-8 h-8 rounded-full border-2 transition-all duration-300 flex items-center justify-center ${isChecked ? 'bg-white border-white' : 'bg-zinc-900 border-zinc-500'}">
                                            <svg class="w-4 h-4 text-black check-icon ${isChecked ? 'active' : 'hidden'}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                    </div>
                                </div>
                                <p class="text-xs text-zinc-300 mt-4 leading-relaxed">${exo.desc}</p>
                                <div class="flex gap-5 mt-4 pt-4 border-t border-white/10 text-[10px] font-black text-zinc-400 uppercase tracking-wider">
                                    <div>Séries: <span class="text-white">${exo.reps}</span></div>
                                    <div>Repos: <span class="text-white">${exo.rest}</span></div>
                                </div>
                            </div>
                        </label>
                    `;
                });
                exosHtml += `</div>`;

                const ctaHtml = `
                    <button onclick="openModal()" class="w-full bg-white hover:scale-[1.02] active:scale-95 text-black font-black text-xs uppercase tracking-widest py-5 rounded-3xl mt-4 mb-4 transition-all duration-300 shadow-[0_10px_30px_rgba(255,255,255,0.15)] flex justify-center items-center gap-2">
                        Clôturer la Semaine
                    </button>
                `;
                content.innerHTML = daySelectHtml + exosHtml + ctaHtml;

            } else if (currentTab === 'nutrition') {
                const weekIndex = getWeekNumber() % 4;
                const menuSemaine = rotationMenus[weekIndex];

                let nutHtml = `<div class="space-y-4 pb-4 animate-item">
                    <div class="glass-card rounded-3xl p-5 bg-gradient-to-br from-zinc-950 to-black border-white/10">
                        <span class="text-[9px] font-bold uppercase tracking-widest text-zinc-500 block mb-1">PROGRAMME DIÈTE</span>
                        <h2 class="font-black text-white text-base">Menu Étudiant (Semaine ${weekIndex + 1}/4)</h2>
                        <div class="grid grid-cols-2 gap-4 text-[10px] mt-3 pt-3 border-t border-white/5">
                            <div>
                                <span class="text-zinc-400 font-bold block mb-0.5">🏪 CARREFOUR RIVES D'ARCINS</span>
                                <p class="text-zinc-300">Sans Carte: <span class="text-white font-bold">${menuSemaine.budget.carrefour.sans}</span></p>
                                <p class="text-zinc-500">Avec Carte: <span class="text-zinc-300 font-bold">${menuSemaine.budget.carrefour.avec}</span></p>
                            </div>
                            <div>
                                <span class="text-zinc-400 font-bold block mb-0.5">🏪 AUCHAN BOULIAC</span>
                                <p class="text-zinc-300">Sans Carte: <span class="text-white font-bold">${menuSemaine.budget.auchan.sans}</span></p>
                                <p class="text-zinc-500">Avec Carte: <span class="text-zinc-300 font-bold">${menuSemaine.budget.auchan.avec}</span></p>
                            </div>
                        </div>
                    </div>
                `;

                // CRÉATION DES BLOCS IMBRIQUÉS (Midi + Soir dans la même carte)
                Object.keys(menuSemaine.daysMeals).forEach(dayLabel => {
                    const meals = menuSemaine.daysMeals[dayLabel];
                    nutHtml += `
                        <div class="glass-card rounded-3xl p-5 border-white/10">
                            <div class="border-b border-white/10 pb-3 mb-4">
                                <h3 class="font-black text-white text-sm tracking-wide uppercase">${dayLabel}</h3>
                                <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest mt-1 block">Midi & Soir</span>
                            </div>
                            
                            <div class="space-y-4">
                                <!-- BLOC MIDI -->
                                <div class="bg-zinc-900/50 rounded-2xl p-4 border border-white/5">
                                    <span class="inline-block bg-white text-black font-black text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-md mb-2">☀️ Midi</span>
                                    <p class="text-sm font-bold text-white">${meals.midi.split(' (')[0]}</p>
                                    <p class="text-[11px] text-zinc-400 mt-1.5 leading-relaxed">${meals.midi.includes(' (') ? meals.midi.split(' (')[1].replace(')', '') : ''}</p>
                                </div>
                                
                                <!-- BLOC SOIR -->
                                <div class="bg-zinc-900/50 rounded-2xl p-4 border border-white/5">
                                    <span class="inline-block bg-zinc-800 text-white font-bold text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-md mb-2">🌙 Soir</span>
                                    <p class="text-sm font-bold text-white">${meals.soir.split(' (')[0]}</p>
                                    <p class="text-[11px] text-zinc-400 mt-1.5 leading-relaxed">${meals.soir.includes(' (') ? meals.soir.split(' (')[1].replace(')', '') : ''}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
                nutHtml += `</div>`;
                content.innerHTML = nutHtml;

            } else if (currentTab === 'bilan') {
                let bilanHtml = `<div class="space-y-4 animate-item">
                    <div class="glass-card rounded-3xl p-6 bg-gradient-to-br from-zinc-900 to-black border-white/5">
                        <h2 class="font-bold text-xs text-zinc-400 uppercase tracking-widest mb-2">Performances</h2>
                        <div class="flex items-end gap-2">
                            <span class="text-5xl font-black text-white">${state.monthlyCount}</span>
                            <span class="text-xs text-zinc-500 font-bold uppercase tracking-wider mb-1">Semaines validées</span>
                        </div>
                    </div>
                `;
                if (state.history.length === 0) {
                    bilanHtml += `
                        <div class="text-center py-12 px-6">
                            <div class="w-12 h-12 bg-zinc-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/5">
                                <svg class="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <p class="text-sm font-bold text-white mb-2">Aucun historique</p>
                        </div>
                    `;
                } else {
                    state.history.forEach((h, index) => {
                        bilanHtml += `
                            <div class="glass-card rounded-3xl p-5 mt-4">
                                <div class="flex justify-between items-center border-b border-white/5 pb-3 mb-3">
                                    <span class="font-bold text-xs text-white uppercase tracking-wider">Semaine du ${h.date}</span>
                                    <span class="text-[10px] text-zinc-500 font-bold">#${state.history.length - index}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-4 text-xs">
                                    <div>
                                        <span class="text-white font-bold block mb-2 text-[10px] uppercase tracking-wider">✅ Fait (${h.faits.length})</span>
                                        <div class="text-[11px] text-zinc-400 space-y-1">${h.faits.map(f => `· ${f}`).join('<br>') || 'Rien'}</div>
                                    </div>
                                    <div>
                                        <span class="text-zinc-500 font-bold block mb-2 text-[10px] uppercase tracking-wider">❌ Manqué (${h.manques.length})</span>
                                        <div class="text-[11px] text-zinc-600 space-y-1">${h.manques.map(m => `· ${m}`).join('<br>') || 'Rien'}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                content.innerHTML = bilanHtml + `</div>`;

            } else if (currentTab === 'profil') {
                if (!isEditingProfile) {
                    // VUE 1 : RÉCAPITULATIF PROPRE (Par défaut)
                    content.innerHTML = `
                        <div class="space-y-4 pb-4 animate-item">
                            <div class="glass-card rounded-3xl p-6 bg-gradient-to-br from-zinc-950 to-black border-white/10 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full blur-[40px]"></div>
                                
                                <h2 class="font-bold text-[10px] text-zinc-400 uppercase tracking-widest border-b border-white/5 pb-3 mb-6 relative z-10">Fiche Physique Actuelle</h2>
                                
                                <div class="grid grid-cols-3 gap-3 text-center relative z-10">
                                    <div class="bg-zinc-900/80 p-4 rounded-2xl border border-white/5">
                                        <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-wider block mb-1">Âge</span>
                                        <span class="text-2xl font-black text-white block">${state.profile.age || '--'}</span>
                                        <span class="text-[10px] font-medium text-zinc-400">ans</span>
                                    </div>
                                    <div class="bg-zinc-900/80 p-4 rounded-2xl border border-white/5">
                                        <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-wider block mb-1">Taille</span>
                                        <span class="text-2xl font-black text-white block">${state.profile.height || '--'}</span>
                                        <span class="text-[10px] font-medium text-zinc-400">cm</span>
                                    </div>
                                    <div class="bg-zinc-900/80 p-4 rounded-2xl border border-white/5">
                                        <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-wider block mb-1">Poids</span>
                                        <span class="text-2xl font-black text-white block">${state.profile.weight || '--'}</span>
                                        <span class="text-[10px] font-medium text-zinc-400">kg</span>
                                    </div>
                                </div>
                            </div>

                            <button onclick="isEditingProfile = true; render();" class="w-full glass-card hover:bg-white/5 text-white font-bold text-[10px] uppercase tracking-widest py-4 rounded-2xl transition-all flex justify-center items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                Modifier mes informations
                            </button>
                        </div>
                    `;
                } else {
                    // VUE 2 : FORMULAIRE DE MODIFICATION (Au clic)
                    content.innerHTML = `
                        <div class="space-y-4 pb-4 animate-item">
                            <div class="glass-card rounded-3xl p-6 space-y-4 border-white/10">
                                <div class="flex justify-between items-center border-b border-white/5 pb-3">
                                    <h2 class="font-bold text-[10px] text-zinc-400 uppercase tracking-widest">Modifier mes données</h2>
                                    <button onclick="isEditingProfile = false; render();" class="text-[10px] text-zinc-500 hover:text-white uppercase font-bold tracking-widest transition-colors">Annuler</button>
                                </div>
                                
                                <div class="space-y-4 pt-2">
                                    <div>
                                        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2 pl-1">Âge</label>
                                        <input type="number" id="p-age" value="${state.profile.age}" class="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-white transition-colors" placeholder="Ex: 24">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2 pl-1">Taille (cm)</label>
                                        <input type="number" id="p-height" value="${state.profile.height}" class="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-white transition-colors" placeholder="Ex: 170">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2 pl-1">Poids (kg)</label>
                                        <input type="number" id="p-weight" value="${state.profile.weight}" class="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-white transition-colors" placeholder="Ex: 60">
                                    </div>
                                    
                                    <button onclick="saveProfile()" class="w-full bg-white text-black font-black text-xs uppercase tracking-widest py-4 rounded-2xl mt-4 hover:scale-[1.02] transition-transform shadow-[0_5px_20px_rgba(255,255,255,0.1)]">
                                        Sauvegarder
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
            calculateProgress();
        }

        function saveProfile() {
            const age = document.getElementById('p-age').value;
            const height = document.getElementById('p-height').value;
            const weight = document.getElementById('p-weight').value;

            if(!age || !height || !weight || age <= 0 || height <= 0 || weight <= 0) {
                showToast("Saisie invalide", "error");
                return;
            }

            state.profile = { age, height, weight };
            saveData();
            isEditingProfile = false; // Repasse sur la vue Récapitulative
            render(); 
            showToast("Profil mis à jour");
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        render();
    </script>
</body>
</html>
